[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reportkit"
version = "0.1.0"
description = "Convert HTML content with tables and charts to production-quality DOCX and PDF documents with native editable charts."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Abhijeet Mishra", email = "akayroot56@gmail.com" },
]
keywords = [
    "html",
    "docx",
    "pdf",
    "converter",
    "word",
    "document",
    "chart",
    "report",
    "office",
    "reportkit",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "python-docx>=1.1",
    "python-pptx>=0.6",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "matplotlib>=3.7",
    "numpy>=1.24",
]

[project.optional-dependencies]
api = [
    "flask>=3.0",
]
dev = [
    "flask>=3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "build>=1.0",
    "types-beautifulsoup4",
]

[project.urls]
Homepage = "https://github.com/Akay24/reportkit"
Documentation = "https://github.com/Akay24/reportkit#readme"
Repository = "https://github.com/Akay24/reportkit"
Issues = "https://github.com/Akay24/reportkit/issues"
Changelog = "https://github.com/Akay24/reportkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/reportkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["reportkit"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "docx.*",
    "pptx.*",
    "openpyxl.*",
    "reportlab.*",
    "bs4.*",
    "matplotlib.*",
    "numpy.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false
